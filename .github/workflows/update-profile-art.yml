name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # Runs daily at 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution streak SVG
        run: python scripts/generate_streak_svg.py xCodeWraith contrib-heatmap.svg

      - name: Render streak and monthly bar stats card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
